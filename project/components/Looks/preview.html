<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Looks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wdth,wght@75..100,400..700&family=Alegreya:ital,wght@0,400..800;1,400..800&family=Andika:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400..700&family=IM+Fell+English:ital@0;1&family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>html,body{margin:0}body.sb-body{min-height:0;background:var(--paper);color:var(--ink);font-family:var(--sb-story)}.pv{position:relative;padding:24px 32px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:grid;gap:18px}</style></head>
<body class="sb-body">
<div class="pv"><div class="sb-looks"><button class="sb-look" type="button" data-sb-look="daylight" style="--sw-paper:#f4f6f2;--sw-a:#f3c6d3;--sw-b:#8cc2e6;--sw-ink:#26323f;--sw-font:'DynaPuff'"><span class="sb-look__swatch" aria-hidden="true"><i></i><i></i><b>Aa</b></span>Meta Daylight<small>Watercolor paper</small></button><button class="sb-look" type="button" data-sb-look="knight" style="--sw-paper:#1c2838;--sw-a:#f0c75e;--sw-b:#8fb4e8;--sw-ink:#f4efe6;--sw-font:'IM Fell English'"><span class="sb-look__swatch" aria-hidden="true"><i></i><i></i><b>Aa</b></span>Knight Night<small>By candle</small></button><button class="sb-look" type="button" data-sb-look="inkblot" style="--sw-paper:#ffffff;--sw-a:#000000;--sw-b:#9e9e9e;--sw-ink:#000000;--sw-font:'IM Fell English'"><span class="sb-look__swatch" aria-hidden="true"><i></i><i></i><b>Aa</b></span>Ink Blot<small>E-ink and print</small></button><button class="sb-look" type="button" data-sb-look="comix" style="--sw-paper:#fffdf5;--sw-a:#ff9fd0;--sw-b:#38b6ee;--sw-ink:#111111;--sw-font:'Bangers'"><span class="sb-look__swatch" aria-hidden="true"><i></i><i></i><b>Aa</b></span>Comix<small>Halftone and balloons</small></button><button class="sb-look" type="button" data-sb-look="origami" style="--sw-paper:#eceef0;--sw-a:#f6c3b8;--sw-b:#9ab6e0;--sw-ink:#1f2a33;--sw-font:'Zen Maru Gothic'"><span class="sb-look__swatch" aria-hidden="true"><i></i><i></i><b>Aa</b></span>Origami<small>Folded paper</small></button><button class="sb-look" type="button" data-sb-look="skein" aria-disabled="true" data-sb-why="Skein silk opens at 25 nougats." style="--sw-paper:#f6ecee;--sw-a:#f2c6d2;--sw-b:#cfe8dc;--sw-ink:#3a2330;--sw-font:'Caveat'"><span class="sb-look__swatch" aria-hidden="true"><i></i><i></i><b>Aa</b></span>Skein silk<small>Silk and copper</small></button></div></div>
<script>var S=window.Storeybrook;if(S){S.ensureDefs();S.mountIcons();}document.querySelectorAll('[data-sb-look]').forEach(function(b){function sync(){var cur=document.documentElement.getAttribute('data-theme')||'daylight';document.querySelectorAll('[data-sb-look]').forEach(function(x){x.setAttribute('aria-pressed',String(x.getAttribute('data-sb-look')===cur));});}sync();b.addEventListener('click',function(){if(b.getAttribute('aria-disabled')==='true'){if(S)S.toast(b.getAttribute('data-sb-why'),{ms:2600});return;}if(S)S.theme.set(b.getAttribute('data-sb-look'),{persist:false});else document.documentElement.setAttribute('data-theme',b.getAttribute('data-sb-look'));sync();});});</script></body></html>
