<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Toast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wdth,wght@75..100,400..700&family=Alegreya:ital,wght@0,400..800;1,400..800&family=Andika:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400..700&family=IM+Fell+English:ital@0;1&family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>html,body{margin:0}body.sb-body{min-height:0;background:var(--paper);color:var(--ink);font-family:var(--sb-story)}.pv{position:relative;padding:24px 32px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:grid;gap:18px}</style></head>
<body class="sb-body">
<div class="pv" style="display:grid;gap:16px;justify-items:center">
<div class="sb-toast" role="status" style="position:relative;left:auto;top:auto;translate:none"><span class="sb-nougat" data-sb-nougat="5" style="--n:34px"></span><span><b>Origami</b> is open now.</span></div>
<button class="sb-btn sb-btn--secondary sb-btn--sm" id="t">Show a toast</button></div>
<script>var S=window.Storeybrook;if(S){S.ensureDefs();S.mountIcons();}if(S){document.querySelectorAll('[data-sb-nougat]').forEach(function(x){x.innerHTML=S.nougatSVG(+x.getAttribute('data-sb-nougat'));});document.getElementById('t').addEventListener('click',function(){S.toast('<span class="sb-nougat" style="--n:34px">'+S.nougatSVG(9)+'</span><span>A nougat for <b>walking the far stone</b>.</span>',{ms:3000});});}</script></body></html>
