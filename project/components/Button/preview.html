<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wdth,wght@75..100,400..700&family=Alegreya:ital,wght@0,400..800;1,400..800&family=Andika:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400..700&family=IM+Fell+English:ital@0;1&family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>html,body{margin:0}body.sb-body{min-height:0;background:var(--paper);color:var(--ink);font-family:var(--sb-story)}.pv{position:relative;padding:24px 32px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:grid;gap:18px}</style></head>
<body class="sb-body">
<div class="pv stack">
<div class="row"><button class="sb-btn sb-btn--primary sb-btn--lg">Play this one</button>
<button class="sb-btn sb-btn--secondary"><span data-sb-icon="voice"></span>Read it to me</button>
<button class="sb-btn sb-btn--quiet">Skip the story</button>
<button class="sb-btn sb-btn--sticker">New look</button></div>
<div class="row"><button class="sb-btn sb-btn--primary sb-btn--icon" aria-label="Read it to me"><span data-sb-icon="play" data-size="26"></span></button>
<button class="sb-btn sb-btn--secondary sb-btn--sm"><span data-sb-icon="map"></span>The brook</button>
<button class="sb-btn sb-btn--primary" disabled>Opens at 6 nougats</button>
<button class="sb-btn sb-btn--secondary" aria-busy="true">Saving the page</button></div>
</div>
<script>var S=window.Storeybrook;if(S){S.ensureDefs();S.mountIcons();}</script></body></html>
