<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Blot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wdth,wght@75..100,400..700&family=Alegreya:ital,wght@0,400..800;1,400..800&family=Andika:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400..700&family=IM+Fell+English:ital@0;1&family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>html,body{margin:0}body.sb-body{min-height:0;background:var(--paper);color:var(--ink);font-family:var(--sb-story)}.pv{position:relative;padding:24px 32px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:grid;gap:18px}</style></head>
<body class="sb-body">
<div class="pv stack"><div id="bh" class="sb-sheet" style="max-width:460px;min-height:150px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center"><div id="bc" style="--cw:120px"></div><div><h3 class="display-s" style="margin:0 0 4px">Saelion woke up</h3><p class="label" style="margin:0">A sprite now: three arms and small wings.</p></div></div>
<p class="row" style="margin:0"><button class="sb-btn sb-btn--secondary sb-btn--sm" id="bb"><span data-sb-icon="ink"></span>Blot it in again</button></p></div>
<script>var S=window.Storeybrook;if(S){S.ensureDefs();S.mountIcons();}if(S){S.creature(document.getElementById('bc'),{stage:3});document.getElementById('bb').addEventListener('click',function(){S.blot(document.getElementById('bh'));});}</script></body></html>
