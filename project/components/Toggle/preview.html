<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Toggle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wdth,wght@75..100,400..700&family=Alegreya:ital,wght@0,400..800;1,400..800&family=Andika:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400..700&family=IM+Fell+English:ital@0;1&family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>html,body{margin:0}body.sb-body{min-height:0;background:var(--paper);color:var(--ink);font-family:var(--sb-story)}.pv{position:relative;padding:24px 32px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:grid;gap:18px}</style></head>
<body class="sb-body">
<div class="pv row" style="gap:28px">
<label class="sb-toggle"><input type="checkbox" checked><span class="sb-toggle__track"><span class="sb-toggle__thumb"></span></span>Hide the words</label>
<label class="sb-toggle"><input type="checkbox"><span class="sb-toggle__track"><span class="sb-toggle__thumb"></span></span>Sound</label>
<label class="sb-toggle"><input type="checkbox" disabled><span class="sb-toggle__track"><span class="sb-toggle__thumb"></span></span>Haptics (not on this device)</label>
</div>
<script>var S=window.Storeybrook;if(S){S.ensureDefs();S.mountIcons();}</script></body></html>
