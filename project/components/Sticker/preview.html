<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sticker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wdth,wght@75..100,400..700&family=Alegreya:ital,wght@0,400..800;1,400..800&family=Andika:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400..700&family=IM+Fell+English:ital@0;1&family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>html,body{margin:0}body.sb-body{min-height:0;background:var(--paper);color:var(--ink);font-family:var(--sb-story)}.pv{position:relative;padding:24px 32px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:grid;gap:18px}</style></head>
<body class="sb-body">
<div class="pv"><div class="sb-album"><div class="sb-sticker" style="--rot:-4deg"><span class="sb-sticker__art"><span data-sb-icon="star" data-size="48"></span></span><span class="sb-sticker__name">first stone</span></div><div class="sb-sticker" style="--rot:3deg"><span class="sb-sticker__art"><span data-sb-icon="leaf" data-size="48"></span></span><span class="sb-sticker__name">the meadow</span></div><div class="sb-sticker sb-sticker--locked" style="--rot:-2deg"><span class="sb-sticker__art"><span data-sb-icon="origami" data-size="48"></span></span><span class="sb-sticker__name">origami</span></div><div class="sb-sticker is-new" style="--rot:5deg"><span class="sb-sticker__art"><span data-sb-icon="heart" data-size="48"></span></span><span class="sb-sticker__name">a friend</span></div></div></div>
<script>var S=window.Storeybrook;if(S){S.ensureDefs();S.mountIcons();}</script></body></html>
