<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Folded</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wdth,wght@75..100,400..700&family=Alegreya:ital,wght@0,400..800;1,400..800&family=Andika:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400..700&family=IM+Fell+English:ital@0;1&family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>html,body{margin:0}body.sb-body{min-height:0;background:var(--paper);color:var(--ink);font-family:var(--sb-story)}.pv{padding:20px 24px;box-sizing:border-box}.figs{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end}figure{margin:0;text-align:center}figure p{margin:6px 0 0;font:500 13px/1.3 var(--sb-ui);color:var(--ink-muted)}.sb-folded{--fw:120px}.say{margin:14px 0 0}</style></head>
<body class="sb-body">
<div class="pv">
<div class="figs">
<figure><div data-sb-folded='{"shape":"crane","label":"A folded paper crane"}'></div><p>crane · kami</p></figure>
<figure><div data-sb-folded='{"shape":"mountain","label":"A folded mountain with a washi cap"}'></div><p>mountain</p></figure>
<figure><div data-sb-folded='{"shape":"deer","label":"A deer’s head folded from kraft"}'></div><p>deer · kraft</p></figure>
<figure><div data-sb-folded='{"shape":"stone","label":"A stone folded from foil"}'></div><p>stone · foil</p></figure>
</div>
<p class="say"><button class="sb-btn sb-btn--secondary sb-btn--sm" type="button" id="again">Fold them again</button></p>
</div>
<script src="../paper.js"></script>
<script>(function(){var S=window.Storeybrook;if(!S||!S.folded)return;document.getElementById('again').onclick=function(){[].forEach.call(document.querySelectorAll('[data-sb-folded]'),function(e){if(e.__folded)e.__folded.refold();});};})();</script></body></html>
