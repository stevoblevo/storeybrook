<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Quiet View — a bedtime reading experiment</title>
<style>
  :root{
    --ink:#fdf8ec; --ink-dim:rgba(253,248,236,.72);
    --amber:rgba(255,196,110,.95); --moon:rgba(253,248,236,.38);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; color:var(--ink);
    font-family:Georgia,Palatino,"Times New Roman",serif;
    background:#1c222b;
  }
  /* ---------- the painting, full-bleed ---------- */
  .painting{
    position:fixed; inset:0;
    background:url("autumn-cottage.png") center 38% / cover no-repeat;
    transition:opacity 1s ease;
    animation:breathe 26s ease-in-out infinite alternate;
  }
  @keyframes breathe{ from{ transform:scale(1) } to{ transform:scale(1.035) } }
  .veil{
    position:fixed; inset:0; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(20,26,34,.34) 0%, rgba(20,26,34,0) 30%,
        rgba(20,26,34,0) 52%, rgba(20,26,34,.62) 100%);
  }
  /* ---------- the words, in their quiet space ---------- */
  .page{
    position:fixed; inset:0; display:flex; align-items:flex-end;
    justify-content:center; padding:0 1.25rem 14vh;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .words{
    max-width:32ch; text-align:center;
    font-size:clamp(1.6rem, 4.6vw, 2.2rem); line-height:1.7;
    text-shadow:0 1px 14px rgba(20,26,34,.65);
    transition:opacity .8s ease;
  }
  .words.fading{ opacity:0 }
  .words span{
    transition:text-shadow .5s ease, color .5s ease;
    text-shadow:0 0 0 rgba(255,196,110,0);
  }
  .words span.lit{
    color:#fff8e2;
    text-shadow:0 0 18px var(--amber), 0 0 4px var(--amber);
  }
  /* ---------- the one allowed control ---------- */
  .moon{
    position:fixed; top:1.1rem; left:1.2rem; z-index:3;
    font-size:1.5rem; line-height:1; color:var(--moon);
    background:none; border:0; padding:.6rem; cursor:pointer;
    transition:color .5s ease; -webkit-tap-highlight-color:transparent;
  }
  .moon:hover,.moon:focus-visible{ color:var(--ink); outline:none }
  .goodnight{
    position:fixed; inset:0; display:none; align-items:flex-end;
    justify-content:center; padding-bottom:16vh; z-index:2;
    cursor:pointer; text-align:center;
  }
  .goodnight.show{ display:flex }
  .goodnight p{
    margin:0; max-width:32ch;
    font-size:clamp(1.6rem, 4.6vw, 2.2rem); line-height:1.7; font-style:italic;
  }
  .goodnight small{
    display:block; margin-top:1.2rem; font-family:system-ui,sans-serif;
    font-size:.85rem; font-style:normal; letter-spacing:.06em; color:var(--ink-dim);
  }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0) }
</style>
</head>
<body>
<div class="painting" id="painting" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<button class="moon" id="moon" aria-label="Leave the quiet view">☾</button>

<main class="page" id="page" role="button" tabindex="0"
      aria-label="Story page. Activate to turn to the next page.">
  <p class="words" id="words" aria-live="polite"></p>
</main>

<div class="goodnight" id="goodnight" role="button" tabindex="0"
     aria-label="The garden sleeps. Activate to begin again.">
  <p>The garden sleeps.<small>tap to begin again</small></p>
</div>

<p class="sr">Bedtime view. No buttons will appear here. Any tap turns the
page, slowly. The crescent moon, top left, is the only way out.</p>

<script>
(function(){
  var verses = [
    "This little piggie went to market, past the gate where the autumn trees are turning.",
    "This little piggie stayed home, where the kettle sings and the curtains breathe.",
    "This little piggie had roast meef, and saved the quiet end for a friend.",
    "This little piggie had none — so everyone shared, and the table grew longer.",
    "And this little piggie cried wee, wee, wee, all the way home — with room between them for the evening."
  ];
  var page = document.getElementById('page');
  var wordsEl = document.getElementById('words');
  var goodnight = document.getElementById('goodnight');
  var moon = document.getElementById('moon');
  var painting = document.getElementById('painting');
  var idx = 0, glowTimer = null, spoken = false;

  function speak(text){
    try{
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85; u.pitch = 1; u.volume = 0.7;
      var voices = window.speechSynthesis.getVoices();
      var warm = voices.filter(function(v){
        return /en[-_]/i.test(v.lang) && /samantha|victoria|serena|aria|jenny|female|zira/i.test(v.name);
      });
      if (warm.length) u.voice = warm[0];
      window.speechSynthesis.speak(u);
    }catch(e){ /* silence is acceptable at bedtime */ }
  }
  function glow(){
    var spans = wordsEl.querySelectorAll('span');
    var i = 0;
    clearInterval(glowTimer);
    glowTimer = setInterval(function(){
      if (i > 0) spans[i - 1].classList.remove('lit');
      if (i >= spans.length){ clearInterval(glowTimer); return; }
      spans[i].classList.add('lit');
      i++;
    }, 420);
  }
  function show(n){
    idx = n;
    wordsEl.innerHTML = verses[idx].split(' ').map(function(w){
      return '<span>' + w.replace(/</g, '&lt;') + '</span>';
    }).join(' ');
    wordsEl.classList.remove('fading');
    glow();
    if (spoken) speak(verses[idx]);
  }
  function turn(){
    if (idx < verses.length - 1){
      spoken = true; /* the tap that turns the page is the consent to speak */
      wordsEl.classList.add('fading');
      painting.style.opacity = 0.55;
      setTimeout(function(){
        painting.style.opacity = 1;
        show(idx + 1);
      }, 800);
    } else {
      leave();
    }
  }
  function leave(){
    try{ window.speechSynthesis.cancel(); }catch(e){}
    page.style.display = 'none';
    moon.style.display = 'none';
    goodnight.classList.add('show');
  }
  function restart(){
    goodnight.classList.remove('show');
    page.style.display = 'flex';
    moon.style.display = 'block';
    spoken = false;
    show(0);
  }
  page.addEventListener('click', turn);
  page.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){
      e.preventDefault(); turn();
    }
  });
  moon.addEventListener('click', function(e){ e.stopPropagation(); leave(); });
  goodnight.addEventListener('click', restart);
  goodnight.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); restart(); }
  });
  show(0);
})();
</script>
</body>
</html>
